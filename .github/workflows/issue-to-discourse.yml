name: Create Discourse topic for new issues

# Opt-in: a repository without the DISCOURSE_* variables skips the job
# (README.md#setup). Runs the default branch's script on the event file, so the
# issue text never reaches a shell (README.md#security).
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  # One FIFO queue per issue or pull request across the forum workflows: the
  # topic exists before a comment, close or reopen for it runs. queue: max keeps
  # every pending run; the default cancels all but the newest.
  group: discourse-${{ github.event.issue.number || github.event.pull_request.number }}
  queue: max

jobs:
  open-topic:
    name: Create Discourse topic
    if: vars.DISCOURSE_URL != '' && vars.DISCOURSE_CATEGORY_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Open the topic and link it on the issue
        env:
          DISCOURSE_URL: ${{ vars.DISCOURSE_URL }}
          DISCOURSE_CATEGORY_ID: ${{ vars.DISCOURSE_CATEGORY_ID }}
          DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
          DISCOURSE_API_USERNAME: ${{ secrets.DISCOURSE_API_USERNAME }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/discourse-sync.mjs open-topic
