name: Try the Sync
description: Open an issue to see its forum topic appear.
title: 'Test: '
body:
  - type: markdown
    attributes:
      value: >-
        This issue, its comments, and closing or reopening it are copied to a
        forum topic. Forum replies come back here as comments. Please do not
        post anything private. Edits and deletions are not copied.
  - type: textarea
    id: body
    attributes:
      label: Message
      description: Any text. It becomes the first post of the topic.
    validations:
      required: true
